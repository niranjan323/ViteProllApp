# CRoll API — Azure App Service Deploy
# Triggers on push to develop branch (branch-based OIDC — must match federated credential)
#
# GitHub Secrets required:
#   AZURE_CLIENT_ID_NONPROD  = 443b366a-a00b-4fde-aa19-3578cc040008
#   AZURE_TENANT_ID          = d810b06c-d004-4d52-b0aa-4f3581ee7020
#   AZURE_SUBSCRIPTION_ID    = b7301a1c-8c93-44c4-b0fd-694385e99522

name: croll-api-dev

on:
  push:
    branches:
      - develop
    paths:
      - 'CRoll.API/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: api-ngea-cr-dev-001
  DOTNET_VERSION: '8.x'

jobs:
  build-api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: .NET Publish
        run: dotnet publish ./CRoll.API/CRoll.API/CRoll.API.csproj -c release -o ./dotnetapp

      - name: Zip application files
        run: |
          cd dotnetapp
          zip -r ../release.zip ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: croll-api
          path: release.zip

  deploy-api:
    runs-on: ubuntu-latest
    needs: build-api

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_NONPROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: croll-api

      - name: Deploy to Azure Web App (API)
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: release.zip

      - name: Deployment Confirmation
        if: success()
        run: |
          echo "Deployment to ${{ env.AZURE_WEBAPP_NAME }} completed successfully."
          echo "Web App URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}"
