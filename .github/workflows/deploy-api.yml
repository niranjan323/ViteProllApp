# CRoll API — Azure App Service Deploy
# Same pattern as digitalrules-api-dev.yml (reference project).
#
# Secrets (same as Digital Rules — may already exist at org level):
#   AZURE_CLIENT_ID_NONPROD  — App Registration client ID (OIDC)
#   AZURE_TENANT_ID          — Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID    — Azure subscription ID

name: croll-api-dev

on:
  push:
    branches:
      - main
    paths:
      - 'CRoll.API/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: api-ngea-cr-dev-001
  DOTNET_VERSION: '8.x'

jobs:
  build-api:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: .NET Publish
        run: dotnet publish ./CRoll.API/CRoll.API/CRoll.API.csproj -c release -o ./dotnetapp

      - name: Zip application files
        run: |
          cd dotnetapp
          zip -r ../release.zip ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: croll-api
          path: release.zip

  deploy-api:
    runs-on: ubuntu-latest
    needs: build-api
    environment:
      name: development
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_NONPROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: croll-api

      - name: Deploy to Azure Web App (API)
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: release.zip

      - name: Deployment Confirmation
        if: success()
        run: |
          echo "Deployment to ${{ env.AZURE_WEBAPP_NAME }} completed successfully."
          echo "Web App URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}"
