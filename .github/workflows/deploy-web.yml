# CRoll Frontend — Azure App Service Deploy
# Triggers on push to develop branch (branch-based OIDC)
# Build runs on ubuntu-latest, deploy runs on self-hosted runner (VNet access for private endpoint)
#
# GitHub Secrets required:
#   AZURE_CLIENT_ID_NONPROD  = 443b366a-a00b-4fde-aa19-3578cc040008
#   AZURE_TENANT_ID          = d810b06c-d004-4d52-b0aa-4f3581ee7020
#   AZURE_SUBSCRIPTION_ID    = b7301a1c-8c93-44c4-b0fd-694385e99522
#   CROLL_API_BASE_URL       = https://api-ngea-cr-dev-001.azurewebsites.net

name: croll-frontend-dev

on:
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: app-ngea-cr-dev-001
  NODE_VERSION: '20'

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install and Build
        # --ignore-scripts skips postinstall electron-rebuild (Windows-only, not needed for web build)
        # --base=/ overrides vite.config base './' so asset paths work on nested routes
        run: |
          npm ci --ignore-scripts
          npx tsc -b && npx vite build --base=/
        env:
          VITE_API_BASE_URL: ${{ secrets.CROLL_API_BASE_URL }}
          VITE_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_NONPROD }}
          VITE_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Zip build output
        run: |
          cd dist
          zip -r ../frontend-release.zip ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: croll-frontend
          path: frontend-release.zip

  deploy-frontend:
    runs-on:
      group: ABS-IMS-DevOps-Self-Hosted
      labels: [self-hosted]
    needs: build-frontend

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_NONPROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: croll-frontend

      - name: Deploy React to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: frontend-release.zip

      - name: Deployment Confirmation
        if: success()
        run: echo "Frontend deployed successfully to ${{ env.AZURE_WEBAPP_NAME }}"
