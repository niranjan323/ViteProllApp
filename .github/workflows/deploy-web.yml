# CRoll Frontend — Azure App Service Deploy
# Triggers on push to main when frontend code changes, or manually from Actions tab.
#
# Required GitHub Secrets:
#   AZURE_CLIENT_ID        — App Registration client ID (OIDC)
#   AZURE_TENANT_ID        — Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID  — Azure subscription ID
#   VITE_API_BASE_URL      — Production API URL
#                            e.g. https://api-ngea-cr-dev-001.azurewebsites.net

name: Deploy CRoll Frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # --ignore-scripts skips the postinstall electron-rebuild step
        # (electron-rebuild requires Windows and is only needed for the desktop build)
        run: npm ci --ignore-scripts

      - name: Build web app
        # Override base to '/' so asset paths work correctly on nested routes
        # (vite.config uses './' which is for Electron; web deploy needs '/')
        run: npx tsc -b && npx vite build --base=/
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Azure Login (OIDC — no secrets stored)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-ngea-cr-dev-001
          package: ./dist
